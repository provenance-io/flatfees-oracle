name: Docker Build and Deploy Test

# Builds the image and pushes it to the test registry. Adapted from
# provenance-io/gha-workflows docker_build_and_argo_deploy_test.yaml, which
# can't be used here because this repo is public and that one is private.
on:
    push:
        tags:
            - "v*"

permissions:
    contents: read
    id-token: write

jobs:
    docker-build:
        runs-on: ubuntu-latest
        env:
            DOCKER_IMAGE: us-east1-docker.pkg.dev/provenance-io-test/docker/flatfees-oracle
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/metadata-action@v5
              id: meta
              with:
                  images: ${{ env.DOCKER_IMAGE }}
                  tags: |
                      type=ref,event=tag
                      type=sha,prefix=git-,priority=1100
            - uses: google-github-actions/auth@v3
              id: auth
              with:
                  token_format: access_token
                  workload_identity_provider: projects/626568543649/locations/global/workloadIdentityPools/gha-runner-pool/providers/gha-runner-pool-provider
                  service_account: gha-runner@provenance-io-test.iam.gserviceaccount.com
            - uses: docker/login-action@v3
              with:
                  registry: us-east1-docker.pkg.dev
                  username: oauth2accesstoken
                  password: ${{ steps.auth.outputs.access_token }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
              env:
                  SOURCE_DATE_EPOCH: 0
