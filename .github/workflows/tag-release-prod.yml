name: Docker Tag and Deploy Prod

# Copies an already-built image from the test registry to the prod registry.
# Adapted from provenance-io/gha-workflows docker_tag_prod_deploy.yaml, which
# can't be used here because this repo is public and that one is private.
on:
    workflow_dispatch:
        inputs:
            docker-tag:
                description: "Docker image tag to deploy to production"
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    flatfees-oracle-release:
        runs-on: ubuntu-latest
        env:
            DOCKER_TAG: ${{ inputs.docker-tag }}
            TEST_IMAGE: us-east1-docker.pkg.dev/provenance-io-test/docker/flatfees-oracle
            PROD_IMAGE: us-central1-docker.pkg.dev/provenance-io/docker/flatfees-oracle
        steps:
            - uses: google-github-actions/auth@v3
              id: auth-test
              with:
                  token_format: access_token
                  workload_identity_provider: projects/626568543649/locations/global/workloadIdentityPools/gha-runner-pool/providers/gha-runner-pool-provider
                  service_account: gha-runner@provenance-io-test.iam.gserviceaccount.com
            - uses: docker/login-action@v3
              with:
                  registry: us-east1-docker.pkg.dev
                  username: oauth2accesstoken
                  password: ${{ steps.auth-test.outputs.access_token }}
            - run: docker pull "$TEST_IMAGE:$DOCKER_TAG"
            - name: Add version.txt layer
              run: |
                  mkdir -p /tmp/version-layer
                  echo "$DOCKER_TAG" > /tmp/version-layer/version.txt
                  cat > /tmp/version-layer/Dockerfile <<EOF
                  FROM $TEST_IMAGE:$DOCKER_TAG
                  COPY version.txt /app/version.txt
                  EOF
                  docker build -t "$PROD_IMAGE:$DOCKER_TAG" /tmp/version-layer
                  rm -rf /tmp/version-layer
            - uses: google-github-actions/auth@v3
              id: auth-prod
              with:
                  token_format: access_token
                  workload_identity_provider: projects/164083564568/locations/global/workloadIdentityPools/gha-runner-pool/providers/gha-runner-pool-provider
                  service_account: gha-runner@provenance-io.iam.gserviceaccount.com
            - uses: docker/login-action@v3
              with:
                  registry: us-central1-docker.pkg.dev
                  username: oauth2accesstoken
                  password: ${{ steps.auth-prod.outputs.access_token }}
            - run: docker push "$PROD_IMAGE:$DOCKER_TAG"
